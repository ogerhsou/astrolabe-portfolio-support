<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrolabe Portfolio</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --text: #111827;
      --muted: #5f6673;
      --card: #ffffff;
      --link: #2563eb;
      --border: #d9dde5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d12;
        --text: #f5f7fb;
        --muted: #a3adbd;
        --card: #151923;
        --link: #60a5fa;
        --border: #2b3240;
      }
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 56px auto;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      margin: 0 0 20px;
    }

    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }

    nav a {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      background: color-mix(in srgb, var(--card), var(--bg) 35%);
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Astrolabe Portfolio</h1>
      <p>Private portfolio tracking, bookkeeping, analysis, iCloud sync, and subscription access for iPhone.</p>
      <p>Your core asset, transaction, and ledger records stay on your device and, when enabled, in your own private iCloud database.</p>
      <nav aria-label="Astrolabe Portfolio links">
        <a href="./support.html">Support</a>
        <a href="./privacy.html">Privacy Policy</a>
      </nav>
    </section>
  </main>
</body>
</html>
